<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo de navegación SGI</title>
<style>
  :root {
    --verde: #01af00; --verde-osc: #0e6e29; --verde-50: #f0fdf4; --verde-100: #dcfce7;
    --gris-50: #f7f6f5; --gris-100: #e6e4e2; --gris-200: #dad6d3; --gris-500: #8c8178; --gris-700: #5e5650; --gris-800: #2f2b28;
    --info: #1770e6; --info-50: #e6f0ff; --warn: #a47b00; --warn-50: #fff4cc; --err: #a61d2a; --err-50: #fde8ea;
    --morado: #6e06b3; --morado-50: #f3e8ff;
    --radio: 10px; --sombra: 0 6px 18px rgba(17,17,17,.06);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--gris-800); background: #f3f4f3; font-size: 14px; line-height: 1.45; }
  button { font: inherit; cursor: pointer; }
  a { color: var(--info); }
  .proto-banner { background: var(--gris-800); color: #fff; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; }
  .proto-banner strong { color: #bef264; }
  .proto-banner label { display: flex; align-items: center; gap: 6px; }
  .proto-banner select { font: inherit; padding: 3px 6px; border-radius: 6px; }
  .app-header { background: #fff; border-bottom: 1px solid var(--gris-200); padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .logo { width: 34px; height: 34px; border-radius: 8px; background: var(--verde); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .app-header h1 { font-size: 16px; margin: 0; }
  .app-header .user { margin-left: auto; color: var(--gris-700); font-size: 13px; }
  .menu-btn { display: none; border: 1px solid var(--gris-200); background: #fff; border-radius: 8px; padding: 6px 10px; }
  .layout { display: flex; min-height: calc(100vh - 100px); }
  .sidebar { width: 250px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--gris-200); padding: 12px; display: flex; flex-direction: column; gap: 4px; }
  .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 8px; color: var(--gris-800); }
  .nav-item:hover { background: var(--gris-50); }
  .nav-item[aria-current="page"] { background: var(--verde-100); color: var(--verde-osc); font-weight: 600; }
  .nav-item .ico { width: 20px; text-align: center; }
  .badge-count { margin-left: auto; background: var(--err); color: #fff; font-size: 11px; border-radius: 999px; padding: 1px 7px; }
  .nav-sub { padding-left: 30px; display: none; flex-direction: column; }
  .nav-sub.open { display: flex; }
  .nav-sub .nav-item { padding: 7px 10px; font-size: 13px; }
  .sidebar-note { margin-top: auto; font-size: 12px; color: var(--gris-500); border-top: 1px dashed var(--gris-200); padding-top: 10px; }
  main { flex: 1; min-width: 0; padding: 18px; }
  .card { background: #fff; border: 1px solid var(--gris-200); border-radius: var(--radio); box-shadow: var(--sombra); padding: 16px; margin-bottom: 16px; }
  .page-title { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 12px; }
  .page-title h2 { margin: 0; font-size: 20px; }
  .muted { color: var(--gris-500); }
  .small { font-size: 12px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .pill { border: 1px solid var(--gris-200); background: #fff; border-radius: 999px; padding: 6px 12px; }
  .pill[aria-pressed="true"] { background: var(--verde); border-color: var(--verde); color: #fff; }
  .filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--gris-700); }
  .field input, .field select { font: inherit; font-size: 14px; padding: 7px 9px; border: 1px solid var(--gris-200); border-radius: 8px; background: #fff; min-width: 0; }
  .field.wide { grid-column: span 2; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
  .toolbar .spacer { flex: 1; }
  .btn { border: 1px solid var(--gris-200); background: #fff; border-radius: 8px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--gris-50); }
  .btn.primary { background: var(--verde); border-color: var(--verde); color: #fff; }
  .btn.primary:hover { background: var(--verde-osc); }
  .btn.sm { padding: 4px 9px; font-size: 13px; }
  .btn.danger { color: var(--err); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--gris-200); border-radius: var(--radio); background: #fff; }
  table { border-collapse: collapse; width: 100%; min-width: 760px; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--gris-100); text-align: left; vertical-align: top; }
  th { background: var(--gris-50); font-size: 12px; text-transform: uppercase; letter-spacing: .02em; color: var(--gris-700); position: sticky; top: 0; }
  tr:last-child td { border-bottom: 0; }
  .tag { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .t-ok { background: var(--verde-100); color: var(--verde-osc); }
  .t-info { background: var(--info-50); color: var(--info); }
  .t-warn { background: var(--warn-50); color: var(--warn); }
  .t-err { background: var(--err-50); color: var(--err); }
  .t-gray { background: var(--gris-100); color: var(--gris-700); }
  .t-mor { background: var(--morado-50); color: var(--morado); }
  .row-actions { display: flex; gap: 6px; align-items: center; position: relative; }
  .menu { position: absolute; right: 0; top: 100%; z-index: 20; background: #fff; border: 1px solid var(--gris-200); border-radius: 8px; box-shadow: 0 12px 28px rgba(0,0,0,.12); min-width: 230px; padding: 6px; display: none; }
  .menu.open { display: block; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; }
  .menu button:hover, .menu button:focus { background: var(--verde-50); outline: none; }
  .menu hr { border: 0; border-top: 1px solid var(--gris-100); margin: 4px 0; }
  .pager { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 10px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: #fff; border: 1px solid var(--gris-200); border-radius: var(--radio); padding: 12px; }
  .kpi .v { font-size: 22px; font-weight: 700; }
  .kpi .l { font-size: 12px; color: var(--gris-700); }
  .kpi.eq { background: var(--gris-50); }
  .inner-tabs { display: flex; gap: 4px; overflow-x: auto; margin: 4px 0 14px; }
  .inner-tabs button { border: 1px solid var(--gris-200); background: #fff; border-radius: 8px; padding: 7px 12px; white-space: nowrap; }
  .inner-tabs button[aria-selected="true"] { background: var(--gris-800); border-color: var(--gris-800); color: #fff; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; }
  .kv dt { color: var(--gris-500); font-size: 12px; text-transform: uppercase; }
  .kv dd { margin: 0; }
  .timeline-day { margin: 14px 0 6px; font-weight: 700; color: var(--gris-700); font-size: 13px; }
  .event { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 12px; border: 1px solid var(--gris-200); border-radius: var(--radio); background: #fff; margin-bottom: 8px; }
  .event .hora { font-weight: 700; font-size: 13px; }
  .event .hora span { display: block; font-weight: 400; color: var(--gris-500); font-size: 11px; }
  .event h4 { margin: 0 0 2px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .event .meta { font-size: 12px; color: var(--gris-700); }
  .event .ref { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--gris-500); }
  .linked { margin-top: 8px; border-left: 3px solid var(--morado); padding: 6px 10px; background: var(--morado-50); border-radius: 0 8px 8px 0; font-size: 13px; }
  .nodata { border: 1px dashed var(--gris-200); border-radius: var(--radio); padding: 10px 12px; color: var(--gris-700); background: var(--gris-50); font-size: 13px; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--gris-200); background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--gris-800); color: #fff; border-color: var(--gris-800); }
  .note { background: var(--info-50); border: 1px solid #cfe3ff; color: #0b47a6; border-radius: var(--radio); padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .warnbox { background: var(--warn-50); border: 1px solid #ffe083; color: #6b5000; border-radius: var(--radio); padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .empty { text-align: center; padding: 36px 16px; color: var(--gris-500); }
  .toast { position: fixed; right: 16px; bottom: 16px; max-width: 420px; background: var(--gris-800); color: #fff; padding: 12px 14px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); font-size: 13px; display: none; z-index: 50; }
  .toast.show { display: block; }
  .toast code { color: #bef264; word-break: break-all; }
  .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .img { aspect-ratio: 4/3; background: repeating-linear-gradient(45deg, var(--gris-100), var(--gris-100) 8px, #fff 8px, #fff 16px); border-radius: 8px; display: grid; place-items: center; color: var(--gris-500); font-size: 12px; border: 1px solid var(--gris-200); }
  .titulo-verde { color: #01af00; font-size: 28px !important; font-weight: 800; }
  .busqueda { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .buscar-input { flex: 1 1 260px; min-width: 0; font: inherit; padding: 11px 14px; border: 1px solid var(--gris-200); border-radius: 10px; }
  .acciones-fila { display: flex; flex-wrap: wrap; gap: 6px; max-width: 560px; }
  .accion { border: 0; border-radius: 10px; padding: 7px 11px; color: #fff; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .accion.grande { padding: 10px 16px; font-size: 14px; }
  .accion:hover { filter: brightness(.92); }
  .accion.azul { background: #1770e6; } .accion.azul-osc { background: #0b47a6; }
  .accion.verde { background: #01af00; } .accion.verde-osc { background: #0e6e29; }
  .accion.rojo { background: #dc3545; } .accion.naranja { background: #d9480f; }
  .accion.morado { background: #6e06b3; } .accion.gris-osc { background: #5e5650; } .accion.taupe { background: #8c8178; }
  .th-acc { text-align: center; border-left: 1px solid var(--gris-200); }
  .td-acc { border-left: 1px solid var(--gris-100); background: #fcfcfb; }
  .td-acc .acciones-fila { flex-wrap: nowrap; }
  .acciones-iconos { display: flex; gap: 10px; }
  .icono-grupo { display: inline-flex; gap: 4px; padding-right: 10px; border-right: 1px solid var(--gris-200); }
  .icono-grupo:last-child { border-right: 0; }
  .accion.ico-only { width: 34px; height: 34px; padding: 0; justify-content: center; font-size: 15px; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--gris-700); margin: 0 0 10px; }
  .leyenda > span { display: inline-flex; align-items: center; gap: 6px; }
  .leyenda .accion.ico-only { width: 24px; height: 24px; font-size: 12px; border-radius: 6px; }
  .menu .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.azul { background: #1770e6; } .dot.azul-osc { background: #0b47a6; } .dot.verde-osc { background: #0e6e29; } .dot.naranja { background: #d9480f; }
  .dot.morado { background: #6e06b3; } .dot.gris-osc { background: #5e5650; }
  .acciones-ficha { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
  .grupo-ficha { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--gris-200); border-radius: 10px; padding: 6px 8px; }
  .grupo-t { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--gris-500); margin-right: 2px; }
  .cabecera-pagina { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px; }
  .cabecera-pagina h2 { margin: 0; flex: 0 0 auto; }
  .acciones-cabecera { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; justify-content: flex-end; }
  .accion .count { background: #fff; color: var(--err); font-size: 11px; border-radius: 999px; padding: 0 6px; margin-left: 2px; }
  .fila-filtros th { background: #eeedeb; padding: 6px 8px; position: static; }
  .filtro-col { width: 100%; min-width: 90px; font: inherit; font-size: 13px; padding: 5px 7px; border: 1px solid var(--gris-200); border-radius: 7px; background: #fff; }
  .filtro-col.activo { border-color: #01af00; box-shadow: 0 0 0 2px var(--verde-100); }
  .cols-wrap { position: relative; }
  .cols-panel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; width: 290px; background: #fff; border: 1px solid var(--gris-200); border-radius: 10px; box-shadow: 0 12px 28px rgba(0,0,0,.14); padding: 12px; }
  .col-opt { display: flex; align-items: center; gap: 8px; padding: 5px 2px; font-size: 14px; }
  .resumen-filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 10px; }
  .chip-filtro { display: inline-flex; align-items: center; gap: 6px; background: var(--verde-100); color: var(--verde-osc); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 13px; }
  .chip-filtro button { border: 0; background: #fff; color: var(--verde-osc); border-radius: 999px; width: 20px; height: 20px; line-height: 1; }
  .link-btn { border: 0; background: none; color: var(--info); text-decoration: underline; padding: 0; font-size: 13px; }
  .sidebar-seccion { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--gris-500); margin: 2px 12px 4px; }
  .nav-grupo { font-weight: 600; }
  .nav-estado { flex-direction: column; align-items: flex-start; gap: 1px; }
  .estado-item { font-size: 11.5px; font-weight: 600; }
  .e-neutro { color: var(--gris-500); } .e-info { color: var(--info); } .e-aviso { color: var(--warn); } .e-alerta { color: var(--err); }
  .nav-item[aria-current="page"] .estado-item { opacity: .9; }
  .hub { background: #fff; border: 1px solid var(--gris-200); border-radius: var(--radio); box-shadow: var(--sombra); padding: 12px 16px 14px; margin-bottom: 16px; }
  .hub-title { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--gris-500); margin: 0 0 8px; }
  .hub-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  .hub-buttons .btn { padding: 9px 14px; }
  .btn .count { background: var(--err); color: #fff; font-size: 11px; border-radius: 999px; padding: 1px 7px; }
  .btn.gris { background: #8c8178; border-color: #8c8178; color: #fff; font-weight: 600; }
  .btn.gris:hover { background: #5e5650; }
  .breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
  .stub { border: 2px dashed var(--gris-200); border-radius: var(--radio); padding: 40px 16px; text-align: center; color: var(--gris-500); background: #fff; }
  svg.i { flex-shrink: 0; vertical-align: -3px; }
  .forbidden { text-align: center; padding: 40px 16px; }
  .forbidden .big { font-size: 40px; }
  :focus-visible { outline: 3px solid #74b4ff; outline-offset: 2px; }
  @media (max-width: 860px) {
    .menu-btn { display: inline-block; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 40; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 30px rgba(0,0,0,.2); }
    .sidebar.open { transform: translateX(0); }
    main { padding: 12px 16px; }
    .field.wide { grid-column: span 1; }
    .kv { grid-template-columns: 1fr; }
    .app-header .user { display: none; }
  }
</style>
</head>
<body>
<div class="proto-banner" role="note">
  <span><strong>Prototipo navegable</strong> · datos sintéticos · no es la aplicación ni se conecta a ninguna base de datos</span>
  <label>Ver como
    <select id="rol" aria-label="Rol simulado">
      <option>Administrador</option><option>Instructor</option><option selected>Cuentadante</option><option>Aprendiz</option>
    </select>
  </label>
  <label>Ir a
    <select id="atajo" aria-label="Pantalla del prototipo">
      <option value="inventario">Inventario (listado unificado)</option>
      <option value="ficha">Ficha de equipo</option>
      <option value="ambiente">Ficha de ambiente</option>
      <option value="informe">Informe de uso y préstamos</option>
      <option value="rutas">Rutas antiguas → nuevas</option>
    </select>
  </label>
</div>
<header class="app-header">
  <button class="menu-btn" id="menuBtn" aria-controls="sidebar" aria-expanded="false">Menú</button>
  <div class="logo" aria-hidden="true">SGI</div>
  <h1>Sistema de Gestión de Inventario</h1>
  <span class="user" id="userLabel"></span>
</header>
<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Navegación principal"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

const STAFF = [ADMIN, INS, CTA];

function renderSidebar() {
  const activo = itemActivo();
  const val = (v) => typeof v === 'function' ? v(state.rol) : v;
  let html = '<p class="sidebar-seccion">Consultar y ver estado</p>';
  for (const g of MENU) {
    if (!can(g.roles)) continue;
    if (!g.items) {
      html += `<button class="nav-item" data-item="${g.key}" ${activo === g.key ? 'aria-current="page"' : ''}><span class="ico">${svg(g.ico, 18)}</span>${g.t}</button>`;
      continue;
    }
    const items = g.items.filter(i => can(i.roles));
    if (!items.length) continue;
    const abierto = state.gruposAbiertos[g.key] ?? true;
    html += `<button class="nav-item nav-grupo" data-grupo="${g.key}" aria-expanded="${abierto}"><span class="ico">${svg(g.ico, 18)}</span>${g.t}<span style="margin-left:auto;display:inline-flex">${svg(abierto ? 'chevron-down' : 'chevron-right')}</span></button>
      <div class="nav-sub ${abierto ? 'open' : ''}">${items.map(i => {
        const estado = i.estado ? `<span class="estado-item e-${val(i.tono)}">${val(i.estado)}</span>` : '';
        return `<button class="nav-item nav-estado" data-item="${i.key}" ${activo === i.key ? 'aria-current="page"' : ''}><span>${i.t}</span>${estado}</button>`;
      }).join('')}</div>`;
  }
  const cfg = CONFIG.filter(c => can(c.r));
  const cfgAbierto = state.gruposAbiertos.config ?? false;
  html += `<button class="nav-item nav-grupo" data-grupo="config" aria-expanded="${cfgAbierto}"><span class="ico">${svg('settings', 18)}</span>Configuración<span style="margin-left:auto;display:inline-flex">${svg(cfgAbierto ? 'chevron-down' : 'chevron-right')}</span></button>

    <div class="sidebar-note">El menú sirve para <b>consultar y ver el estado</b>. Las acciones (registrar, verificar, asignar, reportar, mover…) se hacen desde los botones de la página y de cada equipo.</div>`;
  const sb = document.getElementById('sidebar');
  sb.innerHTML = html;
  sb.querySelectorAll('[data-grupo]').forEach(b => b.onclick = () => {
    const k = b.dataset.grupo;
    state.gruposAbiertos[k] = !(state.gruposAbiertos[k] ?? (k !== 'config')); renderSidebar();
  });
  sb.querySelectorAll('[data-item]').forEach(b => b.onclick = () => {
    const item = itemsMenu().find(i => i.key === b.dataset.item);
    if (item.screen) { go(item.screen); return; }
    state.funcion = item; go('funcion');
  });
  sb.querySelectorAll('[data-cfg]').forEach(b => b.onclick = () => toast(`Configuración → ${b.dataset.cfg} (sin cambios en esta entrega).`));
}

function accionFila(b) {

function bindInventario(root) {
  root.querySelectorAll('[data-vista]').forEach(b => b.onclick = () => { state.vista = b.dataset.vista; state.page = 1; render(); });
  const mv = root.querySelector('#misVacio'); if (mv) mv.onchange = () => { state.misVacio = mv.checked; render(); };
  root.querySelectorAll('[data-fila]').forEach(b => b.onclick = () => accionFila(b));
  // Filtros de columna: los select filtran al cambiar; los de texto al pulsar Enter o salir del campo.
  root.querySelectorAll('[data-filtro]').forEach(el => el.onchange = () => {
    state.filtros[el.dataset.filtro] = el.value; state.page = 1; render();
  });
  root.querySelectorAll('[data-quitar]').forEach(b => b.onclick = () => { delete state.filtros[b.dataset.quitar]; render(); });
  const limpiar = () => { state.filtros = {}; state.page = 1; render(); };
  const q = id => root.querySelector(id);
  if (q('#limpiarFiltros')) q('#limpiarFiltros').onclick = limpiar;
  if (q('#limpiarVacio')) q('#limpiarVacio').onclick = limpiar;
  if (q('#formBuscar')) q('#formBuscar').onsubmit = ev => { ev.preventDefault(); toast('«Buscar» combina el texto con los filtros de columna. Todo queda en la URL (<code>?ambiente=12&estado_operativo=En+Uso</code>) y se conserva al volver de una función.'); };
  if (q('#todos')) q('#todos').onclick = () => { limpiar(); toast('«Mostrar todos» limpia el texto y los filtros de columna.'); };
  if (q('#cols')) q('#cols').onclick = ev => { ev.stopPropagation(); state.colsOpen = !state.colsOpen; render(); };
  root.querySelectorAll('[data-col]').forEach(ch => ch.onchange = () => {
    const k = ch.dataset.col;
    if (ch.checked) state.colsOcultas.delete(k); else { state.colsOcultas.add(k); delete state.filtros[k]; }
    render();
  });
  if (q('#colsTodas')) q('#colsTodas').onclick = () => { state.colsOcultas = new Set(); render(); };
  if (q('#colsListo')) q('#colsListo').onclick = () => { state.colsOpen = false; render(); };
  if (q('#prev')) q('#prev').onclick = () => { state.page--; render(); };
  if (q('#next')) q('#next').onclick = () => { state.page++; render(); };
  if (q('#excel')) q('#excel').onclick = () => toast(`Descarga los <b>${root.querySelector('.resumen-filtros b:nth-of-type(2)')?.textContent || ''}</b> equipos del filtro actual (todas las páginas), con las columnas visibles. Celdas saneadas contra fórmulas.`);
}

  const items = [...menu.querySelectorAll('[role=menuitem]')]; const i = items.indexOf(document.activeElement);
  items[(i + (ev.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length].focus(); ev.preventDefault();
});
render();
</script>
