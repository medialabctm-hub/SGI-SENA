# Configuración principal de Nginx
# Limitar procesos worker para evitar sobrecarga en Railway
# "daemon off" NO se declara aquí: docker-entrypoint.sh ya lo pasa vía "nginx -g 'daemon off;'",
# y nginx no permite declarar la misma directiva en ambos lados (error "duplicate").
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # El server block real vive en nginx-server.conf (copiado a /etc/nginx/conf.d/default.conf
    # por el Dockerfile) porque docker-entrypoint.sh necesita editarlo en caliente (resolver,
    # $api_backend) sin tocar este archivo principal.
    include /etc/nginx/conf.d/*.conf;
}
